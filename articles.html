  <style>
    main { max-width: 860px; margin: auto; padding: 3rem 1rem; }
    .article-card {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      background: white;
      transition: box-shadow 0.2s ease, transform 0.2s ease;
    }
    .article-card:hover {
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      transform: translateY(-2px);
    }
    .article-card a { text-decoration: none; color: inherit; display: block; }
    .article-card h2 { color: var(--primary); margin-bottom: 0.3rem; font-size: 1.15rem; }
    .article-card p { margin-top: 0.5rem; font-size: 0.95rem; line-height: 1.6; }
  </style>

</main>

<footer>
  © 2026 Gayan Weerasingha &nbsp;·&nbsp; Electrical &amp; Automation Engineer
</footer>

<script src="data/content.js"></script>
<script>
  const list = document.getElementById('articles-list');
  articles.forEach(a => {
    list.innerHTML += `
      <div class="article-card">
        <a href="${a.link}">
          <h2>${a.title}</h2>
          <p class="muted">${a.date} &nbsp;·&nbsp; ${a.readTime} min read</p>
          <p>${a.excerpt}</p>
        </a>
      </div>`;
  });
</script>
