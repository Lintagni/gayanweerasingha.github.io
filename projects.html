<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projects | Gayan Weerasingha</title>
  <meta name="description" content="Engineering and web app projects by Gayan Weerasingha." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%232563eb'/><text x='50' y='72' font-size='60' font-family='Arial' font-weight='bold' text-anchor='middle' fill='white'>G</text></svg>" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" />
  <!-- Vercel Web Analytics -->
  <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
  <style>
    main { max-width: 1100px; margin: auto; padding: 3rem 1rem; }
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 2rem;
    }
    .project-card {
      background: white;
      border-radius: 14px;
      padding: 1.8rem;
      box-shadow: 0 6px 20px rgba(0,0,0,0.06);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      height: 100%;
    }
    .project-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 16px 36px rgba(0,0,0,0.1);
    }
    .project-card h3 { margin-bottom: 0.3rem; color: var(--primary); }
    .project-card p { font-size: 0.95rem; line-height: 1.6; }
    .filter-bar { display:flex; gap:0.6rem; flex-wrap:wrap; margin-bottom:2rem; }
    .filter-btn {
      padding: 0.35rem 0.9rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: white;
      font-size: 0.83rem;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    .filter-btn.active, .filter-btn:hover {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
  </style>
</head>

<body>

<header class="page-header">
  <h1>Projects</h1>
  <p>Engineering work &amp; web app builds</p>
</header>

<nav>
  <a href="index.html">Home</a>
  <a href="index.html#about">About</a>
  <a href="index.html#skills">Skills</a>
  <a href="index.html#experience">Experience</a>
  <a href="index.html#education">Education</a>
  <a href="index.html#services">Services</a>
  <a href="index.html#projects">Projects</a>
  <a href="articles.html">Articles</a>
  <a href="downloads.html" class="nav-cta">Downloads</a>
  <a href="index.html#contact">Contact</a>
</nav>

<main>
  <a href="index.html" class="back-btn">
    <i class="fa-solid fa-arrow-left"></i> Back to Home
  </a>

  <div class="filter-bar">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="engineering">Engineering</button>
    <button class="filter-btn" data-filter="webapp">Web Apps</button>
  </div>

  <div class="projects-grid" id="projects-grid"></div>
</main>

<footer>
  © 2026 Gayan Weerasingha &nbsp;·&nbsp; Electrical &amp; Automation Engineer
</footer>

<script src="data/content.js"></script>
<script>
  function renderProjects(filter) {
    const grid = document.getElementById('projects-grid');
    const filtered = filter === 'all' ? projects : projects.filter(p => p.type === filter);
    grid.innerHTML = filtered.map(p => {
      const tagHTML = p.tags.map(t =>
        `<span class="tag${t === 'React' || t === 'AI-Built' ? ' tag-green' : ''}">${t}</span>`
      ).join('');
      const externalBadge = p.external
        ? `<span class="external-badge"><i class="fa-solid fa-arrow-up-right-from-square"></i> View live apps</span>`
        : '';
      return `
        <a href="${p.link}" class="project-card-link"${p.external ? ' target="_blank" rel="noopener noreferrer"' : ''}>
          <div class="project-card">
            <h3>${p.title}</h3>
            <p class="muted" style="margin:0.3rem 0 0.7rem;">${p.subtitle} &nbsp;·&nbsp; ${p.year}</p>
            <p>${p.description}</p>
            <div class="tags" style="margin-top:1rem;">${tagHTML}</div>
            ${externalBadge}
          </div>
        </a>`;
    }).join('');
  }

  renderProjects('all');

  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderProjects(btn.dataset.filter);
    });
  });
</script>

</body>
</html>
