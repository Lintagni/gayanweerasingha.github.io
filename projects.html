      color: white;
      border-color: var(--accent);
    }

      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));

<header class="page-header">
  <h1>Projects</h1>
  <p>Engineering work &amp; web app builds</p>
</header>

<main>
  <a href="index.html" class="back-btn">
    <i class="fa-solid fa-arrow-left"></i> Back to Home
  </a>

  <div class="filter-bar">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="engineering">Engineering</button>
    <button class="filter-btn" data-filter="webapp">Web Apps</button>

<script src="data/content.js"></script>
<script>
  function renderProjects(filter) {
    const grid = document.getElementById('projects-grid');
    const filtered = filter === 'all' ? projects : projects.filter(p => p.type === filter);
    grid.innerHTML = filtered.map(p => {
      const tagHTML = p.tags.map(t => `<span class="proj-tag">${t}</span>`).join('');
      const extBadge = p.external
        ? `<div class="external-badge"><i class="fa-solid fa-arrow-up-right-from-square"></i> View live</div>`
        : '';
      return `
        <a href="${p.link}" class="project-card"${p.external ? ' target="_blank" rel="noopener noreferrer"' : ''}>
          <h3>${p.title}</h3>
          <div class="proj-subtitle">${p.subtitle} · ${p.year}</div>
          <p>${p.description}</p>
          <div class="proj-tags">${tagHTML}</div>
          ${extBadge}
        </a>`;
    }).join('');
  }

  renderProjects('all');

  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderProjects(btn.dataset.filter);
    });
  });
</script>
